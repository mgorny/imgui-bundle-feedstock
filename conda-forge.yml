bot:
  automerge: true
build_platform:
  linux_ppc64le: linux_64
conda_build:
  error_overlinking: true
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_64: azure
  linux_aarch64: azure
  linux_ppc64le: azure
  osx_arm64: default
  win_64: azure
  win_arm64: azure
test: native_and_emulated
workflow_settings:
  pagefile_size:
  - os: win
    value: 16
  vm_image:
  - platform: osx_64
    value: macos-14
